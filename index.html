      { time: "~9:30 AM", emoji: "🦅", title: "Creek Street Boardwalk", detail: "Historic wooden boardwalk over Ketchikan Creek. Boutiques, galleries, Dolly's House museum. Salmon fighting upstream are visible right from the boardwalk in August.", type: "sightseeing", tip: "The August salmon run is wild — fish jumping inches from you." },
      { time: "~10:30 AM", emoji: "🍩", title: "Jellyfish Donuts", detail: "Ketchikan's cult-favorite donut shop. Creative, fresh-made donuts with a serious local following. Right near Creek Street — pair the two together. Don't leave Ketchikan without one.", type: "food", tip: "Line out the door on busy days and worth every minute of it." },
      { time: "~11:30 AM", emoji: "🍺", title: "Baleen Brewing", detail: "Small local brewery punching above its weight. Good lunch anchor before the distillery and the walk back to the ship.", type: "beer", tip: "Midday means the pint feels earned AND the crowds haven't packed it yet. Win-win." },
      { time: "~12:30 PM", emoji: "🥃", title: "Uncharted Alaska Distillery", detail: "Local craft spirits — spruce tip gin tastes like Southeast Alaska in a glass. Last stop before heading back to the ship.", type: "beer", tip: "Keep an eye on the clock. All-aboard at 2pm means walking back by 1:30pm." },
      { time: "2:00 PM", emoji: "🚢", title: "All Aboard · Sailaway", detail: "All-aboard is 2pm — the ship departs shortly after. The scenery leaving Ketchikan through the channel is spectacular. Get a drink and get on deck.", type: "logistics", tip: "Early port day means you'll be back on the ship by early afternoon. Use the rest of the day to decompress and explore the ship." },
      { time: "7:00 PM", emoji: "🍽️", { time: "3:00 PM", emoji: "📍", title: "Explore Juneau & Skagway", detail: "Vista Lounge, Deck 7 Aft. The ship's port presenter covers what's coming in Juneau and Skagway — excursion tips, timing, and what not to miss. Perfect prep for the two biggest port days of the trip.", type: "onboard", tip: "Especially useful for the parents so everyone knows what to expect. Worth attending together." },

// Shared hooks + trip-clock logic for all three versions.
(function () {
  const { useState, useEffect } = React;

  function read(key, fallback) {
    try { const v = JSON.parse(localStorage.getItem(key)); return v == null ? fallback : v; }
    catch (e) { return fallback; }
  }

  // Check-off state, shared across versions by namespace ("itin", "pack").
  function useChecks(ns) {
    const key = "alaska:checks:" + ns;
    const [done, setDone] = useState(() => read(key, {}));
    useEffect(() => { localStorage.setItem(key, JSON.stringify(done)); }, [done]);
    const toggle = (id) => setDone((d) => ({ ...d, [id]: !d[id] }));
    const isDone = (id) => !!done[id];
    const countDone = (ids) => ids.reduce((n, id) => n + (done[id] ? 1 : 0), 0);
    return { done, toggle, isDone, countDone };
  }

  // Simulated "trip clock" — lets the Captain preview any day. Persisted.
  function useSim() {
    const key = "alaska:simday";
    const [sim, setSim] = useState(() => localStorage.getItem(key) || "auto");
    useEffect(() => { localStorage.setItem(key, sim); }, [sim]);
    return [sim, setSim];
  }

  function daysUntil(dateStr) {
    const now = new Date();
    const t = new Date(dateStr + "T00:00:00");
    return Math.ceil((t - new Date(now.getFullYear(), now.getMonth(), now.getDate())) / 86400000);
  }

  // Resolve the effective trip state from the sim selection (or the real date).
  function tripState(sim) {
    const { dayDates, tripStart, tripEnd } = window.ITIN;
    if (sim && sim !== "auto") {
      if (sim === "before") return { phase: "before", daysUntil: Math.max(daysUntil(tripStart), 0), firstDayId: dayDates[0].dayId };
      if (sim === "after") return { phase: "after" };
      const idx = dayDates.findIndex((d) => d.dayId === sim);
      return { phase: "during", dayId: sim, dayIndex: idx, total: dayDates.length };
    }
    const todayStr = new Date().toISOString().slice(0, 10);
    if (todayStr < tripStart) return { phase: "before", daysUntil: Math.max(daysUntil(tripStart), 0), firstDayId: dayDates[0].dayId };
    if (todayStr > tripEnd) return { phase: "after" };
    const hit = dayDates.find((d) => d.date === todayStr);
    const idx = dayDates.findIndex((d) => d.date === todayStr);
    return { phase: "during", dayId: hit ? hit.dayId : dayDates[0].dayId, dayIndex: idx, total: dayDates.length };
  }

  window.useChecks = useChecks;
  window.useSim = useSim;
  window.tripState = tripState;
  window.daysUntil = daysUntil;
})();

</script>

function ChoiceLanes({ data }) {
  const colColors = ["#1B4965","#065F46","#7C3A00","#5B21B6"];
  const ref = React.useRef(null);
  const [narrow, setNarrow] = React.useState(true);
  React.useEffect(() => {
    if (!ref.current) return;
    const obs = new ResizeObserver(([e]) => setNarrow(e.contentRect.width < 420));
    obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);
  return (
    <div style={{ display:"flex", gap:0, animation:"fadeUp .4s ease both" }}>
      <div style={{ width:54, flexShrink:0 }} />
      <div style={{ width:48, position:"relative", flexShrink:0, display:"flex", justifyContent:"center" }}>
        <div style={{ position:"absolute", top:0, bottom:0, left:"50%", width:2, marginLeft:-1, background:T.rule }} />
      </div>
      <div ref={ref} style={{ flex:1, minWidth:0, margin:"6px 0 10px" }}>
        <div style={{ ...fi, fontSize:9.5, letterSpacing:"2px", textTransform:"uppercase", color:T.glacierDeep, fontWeight:700, display:"flex", alignItems:"center", gap:6, marginBottom:9 }}>
          <Icon name="utensils" size={14}/> {data.label} · {data.time}
        </div>
        <div style={{ display:"flex", flexDirection: narrow ? "column" : "row", gap:8 }}>
          {data.options.map((opt, i) => (
            <div key={opt.id} style={{ flex: narrow ? "none" : 1, background:T.paper, border:`1px solid ${T.rule}`, borderRadius:11, padding: narrow ? "12px 14px" : "11px 9px", display:"flex", flexDirection: narrow ? "row" : "column", alignItems: narrow ? "flex-start" : "stretch", gap: narrow ? 12 : 6, boxShadow:`0 2px 8px ${T.shadow}` }}>
              <div style={{ display:"flex", alignItems:"center", gap:7, flexShrink:0 }}>
                <div style={{ width:32, height:32, borderRadius:"50%", background:colColors[i%colColors.length]+"22", display:"grid", placeItems:"center", color:colColors[i%colColors.length], flexShrink:0 }}>
                  <Icon name={opt.icon} size={16} />
                </div>
                <div>
                  <div style={{ ...ff, fontWeight:700, fontSize:12, color:T.ink, lineHeight:1.2 }}>{opt.title}</div>
                  <div style={{ ...fi, fontSize:10, color:T.inkFaint, lineHeight:1.2 }}>{opt.subtitle}</div>
                </div>
              </div>
              <div style={{ flex:1, display:"flex", flexDirection:"column", gap:6 }}>
              {opt.badge && <div style={{ ...fi, fontSize:9, letterSpacing:"0.5px", color:colColors[i%colColors.length], background:colColors[i%colColors.length]+"18", borderRadius:4, padding:"2px 6px", alignSelf:"flex-start" }}>{opt.badge}</div>}
              <div style={{ ...fi, fontSize:11, color:T.inkFaint, lineHeight:1.55 }}>{opt.detail}</div>
              {opt.tip && <div style={{ ...fi, fontSize:10, color:T.ink, background:T.paper2, borderRadius:6, padding:"6px 8px", borderLeft:`2px solid ${colColors[i%colColors.length]}`, lineHeight:1.5 }}>💡 {opt.tip}</div>}
              </div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function DayView({ day, back, openDay, expanded, setExpanded }) {
  const visItems = day.items.map((it,i)=>({it,i}));
  const reals = visItems.filter(x=>x.it.type!=="city");
  const firstReal = reals[0], lastReal = reals[reals.length-1];
  const rows = [];
  visItems.forEach(({it,i}) => {
    rows.push(<Node key={i} item={it} idx={i} day={day} isFirst={firstReal && i===firstReal.i} isLast={lastReal && i===lastReal.i} expanded={expanded===i} setExpanded={setExpanded} />);
    if (day.id==="tue" && it.title.includes("Lunch —")) rows.push(<ChoiceLanes key="juneau-lunch" data={juneauLunchChoices} />);
    if (day.id==="tue" && it.title.includes("Lunch —")) rows.push(<Lanes key="lanes" />);
    if (day.id==="tue" && it.title.includes("Dinner —")) rows.push(<ChoiceLanes key="juneau-dinner" data={juneauDinnerChoices} />);
    if (day.id==="thu" && it.title.includes("Lunch —")) rows.push(<ChoiceLanes key="van-thu-lunch" data={vanThurLunchChoices} />);
    if (day.id==="thu" && it.title.includes("Pre-Dinner Beer")) rows.push(<ChoiceLanes key="van-thu-beer" data={vanThurBeerChoices} />);
    if (day.id==="thu" && it.title.includes("Dinner —")) rows.push(<ChoiceLanes key="van-thu-dinner" data={vanThurDinnerChoices} />);
    if (day.id==="sat-morning" && it.title.includes("Night 1 Entertainment")) rows.push(<ChoiceLanes key="day1-night" data={day1NightChoices} />);
    if (day.id==="mon" && it.title.includes("Evening — Pick One")) rows.push(<ChoiceLanes key="day3-eve" data={day3EveChoices} />);
    if (day.id==="wed" && it.title.includes("Lunch —")) rows.push(<ChoiceLanes key="skagway-lunch" data={skagwayLunchChoices} />);
    if (day.id==="wed" && it.title.includes("Post-Train Beer")) rows.push(<ChoiceLanes key="skagway-beer" data={skagwayBeerChoices} />);
  });
  return (
    <div style={{ animation:"slideIn .25s ease" }}>
      {/* original-style hero photo header */}
      <div style={{ position:"relative", margin:"0 -20px", overflow:"hidden", height:200 }}>
        <img src={day.photo} alt={day.title} style={{ width:"100%", height:"100%", objectFit:"cover", display:"block" }} onError={e=>{ e.target.style.display="none"; e.target.parentNode.style.background=day.color; }} />
        <div style={{ position:"absolute", inset:0, background:"linear-gradient(to bottom, rgba(28,24,17,0.35) 0%, transparent 30%, rgba(28,24,17,0.78) 100%)" }} />
        <button onClick={back} style={{ position:"absolute", top:14, left:20, display:"flex", alignItems:"center", gap:6, background:"rgba(20,17,11,0.55)", backdropFilter:"blur(6px)", border:"1px solid rgba(255,255,255,0.18)", color:"#FAF7F2", borderRadius:20, padding:"7px 13px 7px 10px", cursor:"pointer", ...fi, fontSize:11.5, fontWeight:600, whiteSpace:"nowrap" }}>
          <Icon name="route" size={14} /> The Journey
        </button>
        <div style={{ position:"absolute", bottom:16, left:20, right:20 }}>
          <div style={{ ...fi, fontSize:10, letterSpacing:"2.5px", textTransform:"uppercase", color:"rgba(250,247,242,0.85)", fontWeight:600, marginBottom:5, textShadow:"0 1px 4px rgba(0,0,0,0.5)" }}>{day.label} · {REGION[day.section]}</div>
          <div style={{ ...ff, fontWeight:900, fontSize:"clamp(26px,7vw,38px)", color:"#FAF7F2", lineHeight:1.04, letterSpacing:"-0.5px", textShadow:"0 2px 10px rgba(0,0,0,0.45)" }}>{day.title}</div>
          {day.subtitle && <div style={{ ...ff, fontStyle:"italic", fontSize:14.5, color:"rgba(250,247,242,0.88)", marginTop:4, textShadow:"0 1px 6px rgba(0,0,0,0.5)" }}>{day.subtitle}</div>}
        </div>
      </div>

      <Alerts day={day.id} />
      <div style={{ paddingTop:8 }}>{rows}</div>

    </div>
  );
}

          </div>
          <div style={{ ...ff, fontStyle:"italic", fontSize:15.5, color:T.inkFaint, marginTop:10 }}>Vancouver → Ketchikan → Juneau → Skagway → Glacier Bay → Anchorage</div>
          <LiveStrip sim={sim} setSim={setSim} openDay={openDay} />
        </div>
        {/* tabs */}
        <div className="tab-scroll" style={{ maxWidth:720, margin:"0 auto", padding:"14px 20px 0", display:"flex", gap:7, overflowX:"auto" }}>
          {TABS.map(t => {
            const active = !openId && tab===t.id;
            return (
              <button key={t.id+(active?"-on":"")} onClick={()=>switchTab(t.id)} style={{ display:"flex", alignItems:"center", gap:7, padding:"10px 16px", flexShrink:0,
                background: active ? T.glacier : "transparent", color: active ? "#FAF7F2" : T.inkFaint,
                border:`1px solid ${active ? T.glacier : "#3A3530"}`, borderRadius:20, cursor:"pointer",
                ...fi, fontSize:12, letterSpacing:"0.5px", fontWeight: active ? 700 : 500, whiteSpace:"nowrap", marginBottom:18 }}>
                <Icon name={t.icon} size={15} stroke={active?2.2:1.9} /> {t.label}
              </button>
            );
          })}
        </div>
      </div>

      {/* BODY */}
      <div style={{ maxWidth:720, margin:"0 auto", padding:"0 20px 70px" }}>
        {openId ? (
          <DayView day={day} back={backToJourney} openDay={openDay} expanded={expanded} setExpanded={setExpanded} />
        ) : tab==="journey" ? (
          <Journey sim={sim} openDay={openDay} />

        ) : (
          <InfoList dayId={tab} expanded={expanded} setExpanded={setExpanded} />
        )}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
