  glacierTint:"rgba(44,143,163,0.10)",
  rust:       "#8B3A2A",
  rustTint:   "rgba(139,58,42,0.09)",
  moss:       "#4A6741",
  mossTint:   "rgba(74,103,65,0.09)",
  amber:      "#C47C1A",
  amberTint:  "rgba(196,124,26,0.10)",
  rule:       "#DDD5C8",
  shadow:     "rgba(28,24,17,0.08)",
};

// ── PIN BADGE STYLES ──────────────────────────────────────────────────────────
const PIN = {
  logistics: { bg:"#E8E2D8", text:"#5A5044" },
  coffee:    { bg:"#EBD9B4", text:"#7A5418" },
  sightseeing:{ bg:"#C8DDD8", text:"#1C4A57" },
  beer:      { bg:"#D8C8A8", text:"#6B4A18" },
  dinner:    { bg:"#E8C8BC", text:"#7A2E1E" },
  food:      { bg:"#E8C8BC", text:"#7A2E1E" },
  activity:  { bg:"#D0CCB8", text:"#4A5230" },
  scenic:    { bg:"#BFD3D6", text:"#1C4A57" },
  wildlife:  { bg:"#D4DEAD", text:"#3D5220" },
  onboard:   { bg:"#D8CCE8", text:"#3A2870" },
  city:      { bg:"#E0D8CC", text:"#5A5044" },
};

const PIN_LABELS = {
  logistics:"LOGISTICS", coffee:"COFFEE", sightseeing:"SIGHTSEEING",
  beer:"CRAFT BEER", dinner:"DINNER", food:"FOOD", activity:"ACTIVITY",
  scenic:"SCENIC", wildlife:"WILDLIFE", onboard:"SHIP", city:"PORT",
};

function App() {
  const [activeSection, setActiveSection] = useState("vancouver");
  const [activeDay, setActiveDay] = useState("thu");
  const [expandedItem, setExpandedItem] = useState(null);

  useEffect(() => {
    const link = document.createElement("link");
    link.href = "https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,400;1,9..144,600&family=Inter:wght@400;500;600&display=swap";
    link.rel = "stylesheet";
    document.head.appendChild(link);
    document.title = "Voyage of the Glaciers · Alaska 2026";
  }, []);

  const noTabs = ["dinners","anchorage","breweries","maps"].includes(activeSection);
  const visibleDays = allDays.filter(d => d.section === activeSection);
  const currentDay = allDays.find(d => d.id === activeDay) || visibleDays[0];

  const handleSection = (id) => {
    setActiveSection(id);
    const first = allDays.find(d => d.section === id);
    setActiveDay(first.id);
    setExpandedItem(null);
  };

  const ff = { fontFamily: "'Fraunces', Georgia, serif" };
  const fi = { fontFamily: "'Inter', system-ui, sans-serif" };

  // ── RENDER ────────────────────────────────────────────────────────────────
  return (
    <div style={{ minHeight:"100vh", background: T.paper, ...fi, color: T.ink }}>

      {/* ══ MASTHEAD ══════════════════════════════════════════════════════ */}
      <div style={{ background: T.ink, color: T.paper }}>
        <div style={{ maxWidth:720, margin:"0 auto", padding:"32px 20px 0" }}>

          {/* Eyebrow */}
          <div style={{ ...ff, fontSize:11, letterSpacing:"4px", color: T.inkFaint, textTransform:"uppercase", marginBottom:6 }}>
            Alaska 2026 · August 13–22
          </div>

          {/* Big title */}
          <div style={{ display:"flex", alignItems:"baseline", gap:12, flexWrap:"wrap" }}>
            <h1 style={{ ...ff, fontSize:"clamp(38px,9vw,68px)", fontWeight:900, lineHeight:0.92, letterSpacing:"-1.5px", color:"#FAF7F2", margin:0 }}>
              Voyage
            </h1>
            <h1 style={{ ...ff, fontSize:"clamp(38px,9vw,68px)", fontWeight:900, lineHeight:0.92, letterSpacing:"-1.5px", fontStyle:"italic", color: T.glacier, margin:0 }}>
              of the
            </h1>
            <h1 style={{ ...ff, fontSize:"clamp(38px,9vw,68px)", fontWeight:900, lineHeight:0.92, letterSpacing:"-1.5px", color:"#FAF7F2", margin:0 }}>
              Glaciers
            </h1>
          </div>

          <div style={{ ...ff, fontStyle:"italic", fontSize:16, color: T.inkFaint, marginTop:10, marginBottom:20 }}>
            Vancouver → Ketchikan → Juneau → Skagway → Glacier Bay → Anchorage
          </div>

          {/* Section pills */}
          <div style={{ display:"flex", gap:6, flexWrap:"wrap", paddingBottom:20 }}>
            {sections.map(s => {
              const active = activeSection === s.id;
              return (
                <button key={s.id} onClick={() => handleSection(s.id)} style={{
                  padding:"7px 14px",
                  background: active ? s.color : "transparent",
                  color: active ? "#FAF7F2" : T.inkFaint,
                  border: `1px solid ${active ? s.color : "#3A3530"}`,
                  borderRadius:20, cursor:"pointer",
                  ...fi, fontSize:11, letterSpacing:"1px", fontWeight: active ? 600 : 400,
                  transition:"all 0.15s", whiteSpace:"nowrap", textTransform:"uppercase",
                }}>
                  {s.emoji} {s.label}
                </button>
              );
            })}
          </div>

          {/* Day tabs */}
          {!noTabs && (
            <div style={{ display:"flex", overflowX:"auto", borderTop:"1px solid #3A3530", scrollbarWidth:"none", msOverflowStyle:"none" }}>
              {visibleDays.map(day => {
                const active = activeDay === day.id;
                return (
                  <button key={day.id} onClick={() => { setActiveDay(day.id); setExpandedItem(null); }} style={{
                    flexShrink:0, padding:"12px 14px",
                    background:"transparent",
                    color: active ? T.glacier : T.inkFaint,
                    border:"none",
                    borderTop: active ? `2px solid ${T.glacier}` : "2px solid transparent",
                    cursor:"pointer", ...ff, fontSize:11, letterSpacing:"0.5px",
                    transition:"all 0.15s", fontWeight: active ? 700 : 400,
                    lineHeight:1.5, whiteSpace:"nowrap", textAlign:"center",
                  }}>
                    <div style={{ fontSize:15, marginBottom:2 }}>{day.emoji}</div>
                    <div>{day.label.split(" · ")[0]}</div>
                    <div style={{ fontSize:9, opacity:0.7, letterSpacing:"1px" }}>{day.shortLabel}</div>
                  </button>
                );
              })}
            </div>
          )}
          {noTabs && <div style={{ height:4 }} />}
        </div>
      </div>

      {/* ══ BODY ══════════════════════════════════════════════════════════ */}
      <div style={{ maxWidth:720, margin:"0 auto", padding:"0 20px 60px" }}>

        {/* ── Hero photo + day title ─────────────────────────────────── */}
        {currentDay.photo && (
          <div style={{ position:"relative", margin:"0 -20px", overflow:"hidden", height:180 }}>
            <img src={currentDay.photo} alt={currentDay.title}
              style={{ width:"100%", height:"100%", objectFit:"cover", display:"block" }}
              onError={e => { e.target.style.display="none"; e.target.parentNode.style.height="0"; }}
            />
            <div style={{ position:"absolute", inset:0, background:"linear-gradient(to bottom, transparent 20%, rgba(28,24,17,0.75) 100%)" }} />
            <div style={{ position:"absolute", bottom:16, left:20, right:20 }}>
              <div style={{ ...ff, fontWeight:900, fontSize:"clamp(22px,5vw,32px)", color:"#FAF7F2", lineHeight:1.1, letterSpacing:"-0.5px", textShadow:"0 2px 8px rgba(0,0,0,0.4)" }}>
                {currentDay.title}
                {currentDay.subtitle && (
                  <span style={{ fontWeight:400, fontStyle:"italic", fontSize:"0.55em", color:"rgba(250,247,242,0.75)", marginLeft:10 }}>
                    {currentDay.subtitle}
                  </span>
                )}
              </div>
              <div style={{ ...ff, fontSize:11, color:"rgba(250,247,242,0.6)", letterSpacing:"3px", textTransform:"uppercase", marginTop:4 }}>
                {currentDay.label}
              </div>
            </div>
          </div>
        )}

        {/* No-photo day banner */}
        {!currentDay.photo && (
          <div style={{ background: T.paper2, borderBottom:`2px solid ${T.rule}`, padding:"20px 0 16px" }}>
            <div style={{ ...ff, fontWeight:900, fontSize:"clamp(22px,5vw,32px)", color: T.ink, letterSpacing:"-0.5px" }}>
              {currentDay.title}
              {currentDay.subtitle && (
                <span style={{ fontWeight:400, fontStyle:"italic", fontSize:"0.55em", color: T.inkSoft, marginLeft:10 }}>
                  {currentDay.subtitle}
                </span>
              )}
            </div>
            <div style={{ ...ff, fontSize:11, color: T.rust, letterSpacing:"3px", textTransform:"uppercase", marginTop:4 }}>
              {currentDay.label}
            </div>
          </div>
        )}

        {/* ── Maps section ──────────────────────────────────────────── */}
        {activeSection === "maps" && (
          <div style={{ display:"flex", flexDirection:"column", gap:24, paddingTop:24 }}>

            <div style={{ background:"#fff", borderRadius:6, border:`1px solid ${T.rule}`, overflow:"hidden", boxShadow:`0 2px 8px ${T.shadow}` }}>
              <div style={{ padding:"14px 18px 10px", borderBottom:`1px solid ${T.rule}` }}>
                <div style={{ ...ff, fontSize:10, color: T.inkFaint, letterSpacing:"3px", textTransform:"uppercase", marginBottom:3 }}>AUG 13–15</div>
                <div style={{ ...ff, fontWeight:700, fontSize:18, color: T.ink }}>🏙️ Vancouver, BC</div>
                <div style={{ ...fi, fontSize:12, color: T.inkSoft, marginTop:2 }}>Coffee, breweries, dinners, cruise terminal — 11 pins</div>
              </div>
              <iframe title="Vancouver Map" width="100%" height="380"
                style={{ border:"none", display:"block" }} loading="lazy" referrerPolicy="no-referrer-when-downgrade"
                src="https://www.google.com/maps/embed/v1/search?key=AIzaSyCAIXvuVm1WKharqKwocyp_7Kr7T8f88nc&q=Nemesis+Coffee+Vancouver+BC&center=49.278,-123.108&zoom=13"
              />
              <div style={{ padding:"12px 18px", background: T.paper2 }}>
                <div style={{ display:"flex", flexWrap:"wrap", gap:6 }}>
                  {[["Nemesis Coffee","coffee"],["Strathcona Beer Co","beer"],["Revolver Coffee","coffee"],["Capilano Bridge","sightseeing"],["Granville Island","food"],["Brassneck Brewery","beer"],["L'Abattoir","dinner"],["Salmon n' Bannock","dinner"],["Flying Pig Gastown","dinner"],["Cactus Club Harbour","dinner"],["Canada Place Terminal","logistics"]].map(([name,type],i) => (
                    <span key={i} style={{ fontSize:10, ...fi, padding:"3px 8px", background: PIN[type].bg, color: PIN[type].text, borderRadius:3 }}>{name}</span>
                  ))}
                </div>
              </div>
            </div>

            <div style={{ background:"#fff", borderRadius:6, border:`1px solid ${T.rule}`, overflow:"hidden", boxShadow:`0 2px 8px ${T.shadow}` }}>
              <div style={{ padding:"14px 18px 10px", borderBottom:`1px solid ${T.rule}` }}>
                <div style={{ ...ff, fontSize:10, color: T.inkFaint, letterSpacing:"3px", textTransform:"uppercase", marginBottom:3 }}>AUG 22</div>
                <div style={{ ...ff, fontWeight:700, fontSize:18, color: T.ink }}>🦅 Anchorage, AK</div>
                <div style={{ ...fi, fontSize:12, color: T.inkSoft, marginTop:2 }}>Breakfast through departure — 7 pins including ANC airport</div>
              </div>
              <iframe title="Anchorage Map" width="100%" height="380"
                style={{ border:"none", display:"block" }} loading="lazy" referrerPolicy="no-referrer-when-downgrade"
                src="https://www.google.com/maps/embed/v1/search?key=AIzaSyCAIXvuVm1WKharqKwocyp_7Kr7T8f88nc&q=49th+State+Brewing+Anchorage+AK&center=61.210,-149.910&zoom=12"
              />
              <div style={{ padding:"12px 18px", background: T.paper2 }}>
                <div style={{ display:"flex", flexWrap:"wrap", gap:6 }}>
                  {[["Snow City Cafe","coffee"],["Anchorage Museum","sightseeing"],["Tony Knowles Trail","sightseeing"],["Humpy's Alehouse","beer"],["49th State Brewing","beer"],["Wildlife Conservation Ctr","activity"],["ANC Airport","logistics"]].map(([name,type],i) => (
                    <span key={i} style={{ fontSize:10, ...fi, padding:"3px 8px", background: PIN[type].bg, color: PIN[type].text, borderRadius:3 }}>{name}</span>
                  ))}
                </div>
              </div>
            </div>

            <div style={{ padding:"14px 18px", background:"#fff", borderRadius:6, border:`1px solid ${T.rule}`, ...fi, fontSize:11, color: T.inkSoft, lineHeight:1.9 }}>
              <div style={{ ...ff, color: T.glacierDeep, fontWeight:600, letterSpacing:"2px", fontSize:10, textTransform:"uppercase", marginBottom:6 }}>CRUISE PORT MAPS</div>
              Ketchikan, Juneau, Skagway, Glacier Bay, and Whittier are all best navigated on the ground. Ships dock at the town pier — everything in the cruise days is walkable or a short rideshare from the ship.
            </div>
          </div>
        )}

        {/* ── Items list ────────────────────────────────────────────── */}
        {activeSection !== "maps" && (
          <div style={{ paddingTop:8 }}>
            {currentDay.items.map((item, idx) => {
              const isExpanded = expandedItem === idx;
              const pin = PIN[item.type] || PIN.logistics;

              // City divider
              if (item.type === "city") {
                return (
                  <div key={idx} style={{ display:"flex", alignItems:"center", gap:10, padding:"28px 0 10px", marginTop: idx === 0 ? 0 : 4 }}>
                    <div style={{ fontSize:20 }}>{item.emoji}</div>
                    <div>
                      <div style={{ ...ff, fontWeight:700, fontSize:15, color: T.ink, letterSpacing:"0.5px" }}>{item.title}</div>
                      <div style={{ ...fi, fontSize:11, color: T.inkSoft, marginTop:1 }}>{item.detail}</div>
                    </div>
                    <div style={{ flex:1, height:1, background: T.rule, marginLeft:8 }} />
                  </div>
                );
              }

              return (
                <div key={idx} onClick={() => setExpandedItem(isExpanded ? null : idx)}
                  style={{
                    borderBottom: `1px solid ${T.rule}`,
                    padding:"16px 0",
                    cursor:"pointer",
                    transition:"background 0.1s",
                  }}
                >
                  <div style={{ display:"flex", alignItems:"flex-start", gap:12 }}>

                    {/* Time */}
                    <div style={{ ...ff, fontSize:12, fontWeight:600, color: T.inkFaint, minWidth:70, paddingTop:3, flexShrink:0, letterSpacing:"0.3px" }}>
                      {item.time}
                    </div>

                    {/* Emoji */}
                    <div style={{ fontSize:17, paddingTop:2, minWidth:22, flexShrink:0 }}>{item.emoji}</div>

                    {/* Content */}
                    <div style={{ flex:1, minWidth:0 }}>
                      <div style={{ display:"flex", alignItems:"center", gap:8, flexWrap:"wrap", marginBottom:4 }}>
                        <span style={{ ...ff, fontWeight:700, fontSize:17, color: T.ink, lineHeight:1.2 }}>
                          {item.title}
                        </span>
                        <span style={{
                          ...fi, fontSize:9, letterSpacing:"1.5px", textTransform:"uppercase",
                          padding:"2px 7px", background: pin.bg, color: pin.text,
                          borderRadius:3, flexShrink:0, fontWeight:600,
                        }}>
                          {PIN_LABELS[item.type]}
                        </span>
                      </div>
                      <div style={{ ...fi, fontSize:13, color: T.inkSoft, lineHeight:1.65 }}>
                        {item.detail}
                      </div>

                      {/* Expanded panel */}
                      {isExpanded && (item.address || item.hours || item.tip) && (
                        <div style={{
                          marginTop:12, padding:"12px 16px",
                          background: T.paper2,
                          borderRadius:4,
                          borderLeft: `3px solid ${T.glacier}`,
                        }}>
                          {item.address && (
                            <div style={{ display:"flex", gap:10, marginBottom:6 }}>
                              <span style={{ ...ff, fontSize:9, color: T.inkFaint, minWidth:46, paddingTop:1, flexShrink:0, letterSpacing:"1.5px", textTransform:"uppercase", fontWeight:600 }}>Where</span>
                              <span style={{ ...fi, fontSize:12, color: T.ink }}>{item.address}</span>
                            </div>
                          )}
                          {item.hours && (
                            <div style={{ display:"flex", gap:10, marginBottom:6 }}>
                              <span style={{ ...ff, fontSize:9, color: T.inkFaint, minWidth:46, paddingTop:1, flexShrink:0, letterSpacing:"1.5px", textTransform:"uppercase", fontWeight:600 }}>Hours</span>
                              <span style={{ ...fi, fontSize:12, color: T.ink }}>{item.hours}</span>
                            </div>
                          )}
                          {item.tip && (
                            <div style={{
                              display:"flex", gap:10,
                              marginTop: item.address || item.hours ? 8 : 0,
                              paddingTop: item.address || item.hours ? 8 : 0,
                              borderTop: item.address || item.hours ? `1px solid ${T.rule}` : "none",
                            }}>
                              <span style={{ ...ff, fontSize:9, color: T.rust, minWidth:46, paddingTop:1, flexShrink:0, letterSpacing:"1.5px", textTransform:"uppercase", fontWeight:700 }}>Tip</span>
                              <span style={{ ...fi, fontSize:12, color: T.ink, fontStyle:"italic", lineHeight:1.65 }}>{item.tip}</span>
                            </div>
                          )}
                        </div>
                      )}
                    </div>

                    {/* Expand toggle */}
                    <div style={{
                      color: T.rule, fontSize:13, paddingTop:4,
                      transition:"transform 0.2s",
                      transform: isExpanded ? "rotate(180deg)" : "rotate(0deg)",
                      flexShrink:0,
                    }}>↓</div>
                  </div>
                </div>
              );
            })}
          </div>
        )}

        {/* ── Contextual alerts ─────────────────────────────────────── */}
        {activeDay === "thu" && (
          <div style={{ marginTop:20, padding:"12px 18px", background: T.amberTint, borderRadius:6, border:`1px solid ${T.amber}`, ...fi, fontSize:12, color: T.ink }}>
            ⏱ <strong>Customs heads-up:</strong> Budget 60–75 minutes from wheels down to outside the terminal with 6 people. Don't book anything tight for early afternoon.
          </div>
        )}
        {activeDay === "fri" && (
          <div style={{ marginTop:20, padding:"12px 18px", background: T.rustTint, borderRadius:6, border:`1px solid ${T.rust}`, ...fi, fontSize:12, color: T.rust }}>
            🚨 <strong>L'Abattoir reminder:</strong> Closed Sunday. Tonight is your ONLY shot. If you're going, make that reservation before you close this app.
          </div>
        )}
        {activeDay === "wed" && (
          <div style={{ marginTop:20, padding:"12px 18px", background:"rgba(44,143,163,0.08)", borderRadius:6, border:`1px solid ${T.glacier}`, ...fi, fontSize:12, color: T.glacierDeep }}>
            🚂 <strong>White Pass Railway: 2:15pm — confirmed.</strong> Sit on the LEFT side of the train for the best gorge views. Check in at the Broadway depot by ~1:45pm.
          </div>
        )}
        {activeDay === "thu-glacier-bay" && (
          <div style={{ marginTop:20, padding:"12px 18px", background:"rgba(44,143,163,0.08)", borderRadius:6, border:`1px solid ${T.glacier}`, ...fi, fontSize:12, color: T.glacierDeep }}>
            🧊 <strong>The ship enters Glacier Bay at 6:15am.</strong> Set an alarm. This is the whole reason you came to Alaska — do not sleep through it.
          </div>
        )}
        {activeDay === "fri-college-fjord" && (
          <div style={{ marginTop:20, padding:"12px 18px", background: T.amberTint, borderRadius:6, border:`1px solid ${T.amber}`, ...fi, fontSize:12, color: T.ink }}>
            ✈️ <strong>ANC → DFW flight check:</strong> Confirm your Aug 22 departure time and build your Whittier → Anchorage transfer around it. The tunnel out of Whittier has wait times.
          </div>
        )}
        {activeSection === "anchorage" && (
          <div style={{ marginTop:20, padding:"12px 18px", background: T.amberTint, borderRadius:6, border:`1px solid ${T.amber}`, ...fi, fontSize:12, color: T.ink }}>
            🚌 <strong>Shuttle confirmed: 9:45am from Whittier.</strong> Arrives Anchorage ~11:15–11:30am. Uber or rental car from there — you've got a solid day before the midnight flight.
          </div>
        )}

        {/* ── Route footer ──────────────────────────────────────────── */}
        <div style={{ marginTop:32, paddingTop:20, borderTop:`1px solid ${T.rule}` }}>
          <div style={{ ...ff, fontSize:9, color: T.inkFaint, letterSpacing:"3px", textTransform:"uppercase", marginBottom:10 }}>Full Route</div>
          <div style={{ display:"flex", flexWrap:"wrap", gap:6, alignItems:"center" }}>
            {[
              { label:"Vancouver", dayId:"thu", section:"vancouver" },
              { label:"→" },
              { label:"Inside Passage", dayId:"sun", section:"cruise" },
              { label:"→" },
              { label:"Ketchikan", dayId:"mon", section:"cruise" },
              { label:"→" },
              { label:"Juneau", dayId:"tue", section:"cruise" },
              { label:"→" },
              { label:"Skagway", dayId:"wed", section:"cruise" },
              { label:"→" },
              { label:"Glacier Bay", dayId:"thu-glacier-bay", section:"cruise" },
              { label:"→" },
              { label:"College Fjord", dayId:"fri-college-fjord", section:"cruise" },
              { label:"→" },
              { label:"Anchorage", dayId:"sat-anchorage", section:"anchorage" },
            ].map((stop, i) => {
              const isCurrent = stop.dayId === activeDay || (activeSection === "anchorage" && stop.label === "Anchorage");
              return (
                <span key={i} onClick={() => {
                  if (stop.dayId) { setActiveSection(stop.section); setActiveDay(stop.dayId); setExpandedItem(null); }
                }} style={{
                  ...ff, fontWeight: isCurrent ? 700 : 400,
                  fontSize:11,
                  color: isCurrent ? T.ink : stop.label === "→" ? T.rule : T.inkSoft,
                  cursor: stop.dayId ? "pointer" : "default",
                  textDecoration: isCurrent ? "underline" : "none",
                  textUnderlineOffset:3,
                }}>
                  {stop.label}
                </span>
              );
            })}
          </div>
        </div>

      </div>
    </div>
  );
}


    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
