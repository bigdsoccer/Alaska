                    const [bg, text] = colors[pin.type] || colors.logistics;
                    return (
                      <span key={i} style={{ fontSize: "10px", fontFamily: "'DM Mono', monospace", padding: "3px 8px", background: bg, color: text, borderRadius: "4px", letterSpacing: "0.3px" }}>
                        {pin.name}
                      </span>
                    );
                  })}
                </div>
              </div>
            </div>

            {/* Cruise ports note */}
            <div style={{ padding: "14px 18px", background: "#FFFFFF", borderRadius: "10px", border: "1px solid #E5E7EB", fontFamily: "'DM Mono', monospace", fontSize: "11px", color: "#6B7280", lineHeight: 1.8 }}>
              <div style={{ color: "#0369A1", fontWeight: "700", letterSpacing: "2px", fontSize: "10px", marginBottom: "6px" }}>CRUISE PORT MAPS</div>
              Ketchikan, Juneau, Skagway, Glacier Bay, and Whittier are all accessible via Google Maps once you're on the ground. Ships dock at the town pier — everything highlighted in the cruise days is walkable or a short rideshare from the ship.
            </div>
          </div>
        )}

        {/* Items */}
        {activeSection !== "maps" && (
        <div style={{ display: "flex", flexDirection: "column", gap: "5px" }}>
          {currentDay.items.map((item, idx) => {
            const isExpanded = expandedItem === idx;
            const ts = typeStyles[item.type] || typeStyles.logistics;

            // City divider — non-interactive section header
            if (item.type === "city") {
              return (
                <div key={idx} style={{
                  display: "flex", alignItems: "center", gap: "10px",
                  padding: "16px 4px 6px", marginTop: idx === 0 ? 0 : "8px",
                }}>
                  <div style={{ fontSize: "18px" }}>{item.emoji}</div>
                  <div>
                    <div style={{ fontSize: "13px", fontWeight: "700", color: "#111827", fontFamily: "'DM Mono', monospace", letterSpacing: "1px" }}>
                      {item.title}
                    </div>
                    <div style={{ fontSize: "11px", color: "#9CA3AF", marginTop: "1px" }}>{item.detail}</div>
                  </div>
                  <div style={{ flex: 1, height: "1px", background: "#E5E7EB", marginLeft: "8px" }} />
                </div>
              );
            }

            return (
              <div
                key={idx}
                onClick={() => setExpandedItem(isExpanded ? null : idx)}
                style={{
                  background: "#FFFFFF",
                  border: `1px solid ${isExpanded ? currentDay.border : "#E5E7EB"}`,
                  borderRadius: "10px", padding: "14px 16px", cursor: "pointer",
                  transition: "all 0.15s",
                  boxShadow: isExpanded ? "0 2px 12px rgba(0,0,0,0.07)" : "0 1px 2px rgba(0,0,0,0.04)",
                }}
              >
                <div style={{ display: "flex", alignItems: "flex-start", gap: "10px" }}>
                  <div style={{ fontFamily: "'DM Mono', monospace", fontSize: "10px", color: "#9CA3AF", minWidth: "66px", paddingTop: "3px", flexShrink: 0 }}>
                    {item.time}
                  </div>
                  <div style={{ fontSize: "16px", paddingTop: "1px", minWidth: "20px", flexShrink: 0 }}>{item.emoji}</div>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ display: "flex", alignItems: "center", gap: "7px", flexWrap: "wrap", marginBottom: "4px" }}>
                      <span style={{ fontSize: "14px", fontWeight: "600", color: "#111827" }}>{item.title}</span>
                      <span style={{
                        fontSize: "8px", fontFamily: "'DM Mono', monospace", letterSpacing: "1px",
                        padding: "2px 6px", background: ts.bg, color: ts.text,
                        borderRadius: "3px", border: `1px solid ${ts.border}`, flexShrink: 0,
                      }}>{typeLabels[item.type]}</span>
                    </div>
                    <div style={{ fontSize: "12px", color: "#6B7280", lineHeight: 1.65 }}>{item.detail}</div>
                    {isExpanded && (item.address || item.hours || item.tip) && (
                      <div style={{
                        marginTop: "10px", padding: "10px 14px",
                        background: currentDay.bg, borderRadius: "7px",
                        borderLeft: `3px solid ${currentDay.color}`,
                      }}>
                        {item.address && (
                          <div style={{ display: "flex", gap: "10px", marginBottom: "5px" }}>
                            <span style={{ fontSize: "9px", fontFamily: "'DM Mono', monospace", color: "#9CA3AF", minWidth: "46px", paddingTop: "1px", flexShrink: 0 }}>WHERE</span>
                            <span style={{ fontSize: "12px", color: "#374151" }}>{item.address}</span>
                          </div>
                        )}
                        {item.hours && (
                          <div style={{ display: "flex", gap: "10px", marginBottom: "5px" }}>
                            <span style={{ fontSize: "9px", fontFamily: "'DM Mono', monospace", color: "#9CA3AF", minWidth: "46px", paddingTop: "1px", flexShrink: 0 }}>HOURS</span>
                            <span style={{ fontSize: "12px", color: "#374151" }}>{item.hours}</span>
                          </div>
                        )}
                        {item.tip && (
                          <div style={{
                            display: "flex", gap: "10px",
                            marginTop: item.address || item.hours ? "7px" : 0,
                            paddingTop: item.address || item.hours ? "7px" : 0,
                            borderTop: item.address || item.hours ? `1px solid ${currentDay.border}` : "none",
                          }}>
                            <span style={{ fontSize: "9px", fontFamily: "'DM Mono', monospace", color: currentDay.color, minWidth: "46px", paddingTop: "1px", fontWeight: "700", flexShrink: 0 }}>PRO TIP</span>
                            <span style={{ fontSize: "12px", color: "#374151", lineHeight: 1.65 }}>{item.tip}</span>
                          </div>
                        )}
                      </div>
                    )}
                  </div>
                  <div style={{
                    color: "#D1D5DB", fontSize: "12px", paddingTop: "4px",
                    transition: "transform 0.2s", transform: isExpanded ? "rotate(180deg)" : "rotate(0deg)", flexShrink: 0,
                  }}>↓</div>
                </div>
              </div>
            );
          })}
        </div>

        )}

        {/* Contextual alerts */}
        {activeDay === "thu" && (
          <div style={{ marginTop: "16px", padding: "12px 18px", background: "#FFFBEB", borderRadius: "10px", border: "1px solid #FDE68A", fontFamily: "'DM Mono', monospace", fontSize: "12px", color: "#92400E" }}>
            ⏱ <strong>Customs heads-up:</strong> Budget 60–75 minutes from wheels down to outside the terminal with 6 people. Don't book anything tight for early afternoon.
          </div>
        )}
        {activeDay === "fri" && (
          <div style={{ marginTop: "16px", padding: "12px 18px", background: "#FEF2F2", borderRadius: "10px", border: "1px solid #FECACA", fontFamily: "'DM Mono', monospace", fontSize: "12px", color: "#991B1B" }}>
            🚨 <strong>L'Abattoir reminder:</strong> Closed Sunday. Tonight is your ONLY shot. If you're going, make that reservation before you close this app.
          </div>
        )}
        {activeDay === "wed" && (
          <div style={{ marginTop: "16px", padding: "12px 18px", background: "#ECFDF5", borderRadius: "10px", border: "1px solid #6EE7B7", fontFamily: "'DM Mono', monospace", fontSize: "12px", color: "#065F46" }}>
            🚂 <strong>White Pass Railway: 2:15pm — confirmed.</strong> Sit on the LEFT side of the train for the best gorge views. Check in at the Broadway depot by ~1:45pm.
          </div>
        )}
        {activeDay === "thu-glacier-bay" && (
          <div style={{ marginTop: "16px", padding: "12px 18px", background: "#ECFEFF", borderRadius: "10px", border: "1px solid #67E8F9", fontFamily: "'DM Mono', monospace", fontSize: "12px", color: "#164E63" }}>
            🧊 <strong>Set an alarm for sunrise.</strong> Glacier Bay in morning light is the kind of thing people fly to Alaska for. Don't sleep through it.
          </div>
        )}
        {activeDay === "sat-anchorage" && (
          <div style={{ marginTop: "16px", padding: "12px 18px", background: "#FFFBEB", borderRadius: "10px", border: "1px solid #FDE68A", fontFamily: "'DM Mono', monospace", fontSize: "12px", color: "#92400E" }}>
            🚇 <strong>Tunnel timing:</strong> The Whittier tunnel alternates directions on a roughly 30-min cycle. Your shuttle driver will know the schedule, but don't be surprised by a wait.
          </div>
        )}

        {/* Route footer */}
        <div style={{
          marginTop: "24px", padding: "14px 18px", background: "#FFFFFF",
          borderRadius: "10px", border: "1px solid #E5E7EB",
          fontFamily: "'DM Mono', monospace", fontSize: "10px", color: "#9CA3AF",
        }}>
          <div style={{ marginBottom: "8px", color: "#6B7280", fontSize: "9px", letterSpacing: "2px" }}>FULL ROUTE</div>
          <div style={{ display: "flex", flexWrap: "wrap", gap: "4px", alignItems: "center" }}>
            {[
              { label: "Vancouver", dayId: "thu", section: "vancouver" },
              { label: "→" },
              { label: "Inside Passage", dayId: "sun", section: "cruise" },
              { label: "→" },
              { label: "Ketchikan", dayId: "mon", section: "cruise" },
              { label: "→" },
              { label: "Juneau", dayId: "tue", section: "cruise" },
              { label: "→" },
              { label: "Skagway", dayId: "wed", section: "cruise" },
              { label: "→" },
              { label: "Glacier Bay", dayId: "thu-glacier-bay", section: "cruise" },
              { label: "→" },
              { label: "College Fjord", dayId: "fri-college-fjord", section: "cruise" },
              { label: "→" },
              { label: "Anchorage", dayId: "sat-anchorage", section: "anchorage" },
            ].map((stop, i) => {
              const isCurrent = stop.dayId === activeDay || (activeSection === "anchorage" && stop.label === "Anchorage");
              return (
                <span
                  key={i}
                  onClick={() => {
                    if (stop.dayId) {
                      setActiveSection(stop.section);
                      setActiveDay(stop.dayId);
                      setExpandedItem(null);
                    }
                  }}
                  style={{
                    color: isCurrent ? "#111827" : stop.label === "→" ? "#E5E7EB" : "#9CA3AF",
                    fontWeight: isCurrent ? "700" : "400",
                    cursor: stop.dayId ? "pointer" : "default",
                    fontSize: "10px",
                    textDecoration: isCurrent ? "underline" : "none",
                    textUnderlineOffset: "3px",
                  }}
                >
                  {stop.label}
                </span>
              );
            })}
          </div>
        </div>
      </div>
    </div>
  );
}


    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
